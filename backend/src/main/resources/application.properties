# ---------------------------------------------------------
# Application name (used internally by Spring Boot)
# ---------------------------------------------------------
spring.application.name=backend

# ---------------------------------------------------------
# Port where the backend runs during development (WSL)
# ---------------------------------------------------------
server.port=8080

# ---------------------------------------------------------
# Database configuration
# - url: JDBC URL for the database connection
# - driverClassName: JDBC driver class for PostgreSQL
# - username: database username
# - password: database password
# ---------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# ---------------------------------------------------------
# JPA / Hibernate configuration
# - ddl-auto=validate: el esquema lo define db/init.sql, que es la unica
#   fuente de verdad. Hibernate solo comprueba al arrancar que las tablas
#   y columnas que mapea existen; no las crea ni las modifica.
#   Con "update" Hibernate hacia ALTER TABLE sobre una tabla que tambien
#   usa el db_gateway, y las dos partes se pisaban el esquema.
#   Para cambiar el esquema: edita db/init.sql y  make clean && make
# - show-sql=true: prints SQL queries to the console
# - format_sql=true: formats SQL queries for readability
# ---------------------------------------------------------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ---------------------------------------------------------
# Disable "Open-In-View"
# Prevents lazy-loading queries during JSON serialization
# Recommended for security, WebSockets, and Docker environments
# ---------------------------------------------------------
spring.jpa.open-in-view=false
