# ---------------------------------------------------------
# Application name (used internally by Spring Boot)
# ---------------------------------------------------------
spring.application.name=backend

# ---------------------------------------------------------
# Port where the backend runs during development (WSL)
# ---------------------------------------------------------
server.port=8080

# ---------------------------------------------------------
# Database configuration
# - url: JDBC URL for the database connection
# - driverClassName: JDBC driver class for PostgreSQL
# - username: database username
# - password: database password
# ---------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# ---------------------------------------------------------
# JPA / Hibernate configuration
# - ddl-auto=update: automatically creates/updates tables
# - show-sql=true: prints SQL queries to the console
# - format_sql=true: formats SQL queries for readability
# ---------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ---------------------------------------------------------
# Disable "Open-In-View"
# Prevents lazy-loading queries during JSON serialization
# Recommended for security, WebSockets, and Docker environments
# ---------------------------------------------------------
spring.jpa.open-in-view=false
