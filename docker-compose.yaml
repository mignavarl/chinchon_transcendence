services:
  godot:
    build: .
    container_name: godot-server
    tty: true
    volumes:
      - godot_data:/godotapp
    healthcheck:
      test: ["CMD-SHELL", "test -f /godotapp/index.html || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - transcendence_net

  # Una sola base de datos para todo: el backend de Spring y el db_gateway.
  # init.sql solo se ejecuta la PRIMERA vez, cuando el volumen esta vacio.
  # Si ya la habias levantado antes:  make clean && make
  postgres:
    image: postgres:16
    container_name: transcendence_postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Sin puerto publicado: solo se llega desde la red interna de compose.
    networks:
      - transcendence_net

  backend:
    build: ./backend
    container_name: transcendence_backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      # Firma los tokens con esto; el db_gateway los verifica con el mismo
      # valor (alli entra por env_file). Los dos tienen que coincidir.
      JWT_SECRET: ${JWT_SECRET:-change-in-production-change-in-production}
    # Sin puerto publicado: todo entra por nginx (HTTPS), que lo alcanza por
    # la red interna. Publicar el 8080 dejaba la API y el WebSocket en HTTP
    # plano, saltandose el TLS.
    networks:
      - transcendence_net

  db_gateway:
    build: ./db_gateway
    container_name: chinchon_db_gateway
    env_file: .env
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # Los avatares que suben los usuarios (db_gateway/avatar_upload.js).
    volumes:
      - avatars:/data/avatars
    # Sin puerto publicado: nginx lo alcanza por la red interna de compose.
    networks:
      - transcendence_net

  frontend:
    build: ./frontend
    container_name: transcendence_frontend
    env_file:
      - .env
    environment:
      BACKEND_URL: http://backend:8080
      HTTPS_PORT: 9443
    ports:
      - "9090:80"
      - "9443:443"
    volumes:
      - ./nginx/certs:/etc/nginx/ssl:ro
      - godot_data:/usr/share/nginx/html:ro
    depends_on:
      backend:
        condition: service_started
      godot:
        condition: service_healthy
      # nginx resuelve el host "db_gateway" al arrancar, asi que si el
      # gateway no existe todavia no levanta.
      db_gateway:
        condition: service_started
    networks:
      - transcendence_net

volumes:
  godot_data:
  pgdata:
  avatars:

networks:
  transcendence_net:
